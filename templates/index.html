<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/static/style.css">

<title>Pavan Gopal Virinchi Motupalli</title>

<style>

/* ========================= */
/* SPLIT SCREEN CONTAINER */
/* ========================= */

.split-container{
display:flex;
height:100vh;
position:relative;
}


/* ========================= */
/* PANELS */
/* ========================= */

.panel{

flex:1;

display:flex;

align-items:center;

justify-content:center;

text-decoration:none;

color:white;

transition:.3s ease;

position:relative;

cursor:pointer;

}


/* cinematic hover */

.panel:hover{

transform:scale(1.02);

box-shadow:inset 0 0 120px rgba(255,255,255,.08);

}


/* clickable indicator */

.panel::after{

content:"Click to Enter";

position:absolute;

bottom:40px;

left:50%;

transform:translateX(-50%);

font-size:14px;

letter-spacing:1px;

opacity:.65;

transition:.25s ease;

}


.panel:hover::after{

opacity:1;

transform:translateX(-50%) translateY(-6px);

}


/* ========================= */
/* PANEL BACKGROUNDS */
/* ========================= */

.engineer{

background:

linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),

url("/static/engineer.jpeg");

background-size:cover;

background-position:center;

}


.fighter{

background:

linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),

url("/static/fight2.jpeg");

background-size:cover;

background-position:center;

}


/* ========================= */
/* CENTER PORTRAIT */
/* ========================= */

.identity{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

text-align:center;

z-index:3;

}


.identity img{

width:320px;

border-radius:14px;

box-shadow:0 20px 60px rgba(0,0,0,.8);

}


/* name */

.identity h1{

margin-top:14px;

font-weight:700;

font-size:28px;

letter-spacing:.4px;

}


/* ========================= */
/* PANEL HEADER CONTENT */
/* ========================= */

.panel-content{

position:absolute;

top:60px;

left:50%;

transform:translateX(-50%);

text-align:center;

}


/* icons */

.icon img{

width:70px;

}


/* martial icon gold tint fix */

.martial-icon{

filter:

invert(85%)

sepia(35%)

saturate(400%)

hue-rotate(5deg)

brightness(95%);

}


/* titles */

.label{

font-size:46px;

font-weight:600;

margin-top:14px;

}


/* subtitle */

.sub{

font-size:16px;

opacity:.85;

margin-top:6px;

}



/* ========================= */
/* MOBILE LAYOUT */
/* ========================= */

@media(max-width:900px){

.split-container{

flex-direction:column;

height:100vh;

}


/* equal halves */

.panel{

height:50vh;

}


/* portrait divider center */

.identity{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%, -50%);

z-index:5;

}


/* square portrait */

.identity img{

width:150px;

height:150px;

object-fit:cover;

object-position:top;

border-radius:12px;

border:1px solid rgba(255,255,255,.18);

box-shadow:0 8px 24px rgba(0,0,0,.55);

}


/* hide name mobile */

.identity h1{

display:none !important;

}


/* panel header spacing */

.panel-content{

top:40px;

}


/* mobile font sizes */

.label{

font-size:30px;

}


.sub{

font-size:13px;

opacity:.9;

}


/* mobile click indicator */

.panel::after{

bottom:20px;

font-size:12px;

opacity:.75;

}

}

</style>

</head>

<body>

<div class="split-container">


<!-- center portrait -->

<div class="identity">

<img src="/static/landing.jpeg">

<h1>Pavan Gopal Virinchi Motupalli</h1>

</div>



<!-- engineer panel -->

<a href="/engineer" class="panel engineer">

<div class="panel-content">

<div class="icon">

<img src="/static/laptop.svg">

</div>

<div class="label">The Engineer</div>

<div class="sub">

AI • Physics • Mathematics

</div>

</div>

</a>



<!-- martial artist panel -->

<a href="/fighter" class="panel fighter">

<div class="panel-content">

<div class="icon">

<img src="/static/fist.svg" class="martial-icon">

</div>

<div class="label">The Martial Artist</div>

<div class="sub">

Kickboxing • MMA

</div>

</div>

</a>


</div>

</body>

</html>
